version = 1

[merge]
automerge_label = "automerge"
method = "squash"
delete_branch_on_merge = true
blocking_labels = ["wip", "do-not-merge"]

[approve]
# Approve by PR author, not by label: anyone with Triage access can attach
# a label to their own PR, but nobody can open a PR as Dependabot. Kodiak
# wants the login without the [bot] suffix.
#
# This approves every Dependabot PR, including ecosystems
# dependabot-automerge-label.yml doesn't label, and re-approves after
# anyone pushes to a Dependabot branch. Only `automerge` queues a merge,
# and that workflow strips it on a push by anyone but Dependabot or Kodiak.
# Accepted residual: Kodiak approves these PRs even when the workflow
# doesn't queue them, so anyone who can add `automerge` (Triage access)
# lands one on Kodiak's approval alone, outside CODEOWNERS paths. That covers
# a PR the workflow didn't queue (Dependabot's own bump, unreviewed) and,
# worse, one whose label was stripped after someone else pushed to it:
# re-adding `automerge` lands that person's commits with no human review.
auto_approve_usernames = ["dependabot"]
