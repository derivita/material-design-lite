version = 1

[merge]
automerge_label = "automerge"
method = "squash"
delete_branch_on_merge = true
blocking_labels = ["wip", "do-not-merge"]

[approve]
# Approve by PR author, not by label: anyone with Triage access can attach
# a label to their own PR, but nobody can open a PR as Dependabot. Kodiak
# wants the login without the [bot] suffix.
#
# This approves every Dependabot PR, including ecosystems
# dependabot-automerge-label.yml doesn't label; only `automerge` queues a
# merge. The org ruleset "Protect Dependabot branches" keeps everyone but
# Dependabot and Kodiak from pushing to those branches. Accepted residual:
# anyone who can add `automerge` (Triage access) can land a Dependabot bump
# the workflow didn't queue, on Kodiak's approval alone, outside CODEOWNERS
# paths.
auto_approve_usernames = ["dependabot"]
