name: CI
on:
  pull_request:
  merge_group:

jobs:
  tests:
    name: runner / tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm install
      - run: npm run test
        env:
          # phantomjs 2.x ships an old libssl that fails to load on the
          # runner's OpenSSL 3. Bypass loading the system openssl config
          # so phantomjs can boot and run the mocha test suite.
          OPENSSL_CONF: /dev/null
